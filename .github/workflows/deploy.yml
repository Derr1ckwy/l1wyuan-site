name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
  # Content repo changes are picked up by periodic sync (admin has no push
  # access to this repo's Actions, so content-updated dispatch is unused for now)
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate GitHub App token for content repo
        id: content-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: Derr1ckwy
          repositories: l1wyuan-site-content

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build (sync content from content repo)
        working-directory: web
        env:
          GITHUB_CONTENT_TOKEN: ${{ steps.content-token.outputs.token }}
          CONTENT_REPO_OWNER: Derr1ckwy
          CONTENT_REPO_NAME: l1wyuan-site-content
          CONTENT_REPO_BRANCH: main
        run: npm run build:remote

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
